[general]
# models that classify and vote. The first one breaks ties
# supported models:
#   claude       - Claude (API key below, or your Claude subscription through the Claude Code CLI if no key)
#   chatgpt      - ChatGPT (needs an OpenAI API key below)
#   qwen         - Qwen, runs locally with Ollama (free, no key)
#   laya         - laya, yes/no question per sector (free, no key)
#   laya_choice  - laya, picks one sector from the list (free, no key). Not recommended:
#                  it answers Information Technology for most events (4/30 correct in our test)
models = claude, qwen, laya
# folder with the MISP event JSON files
events_folder = events

[qwen]
# Ollama model name and address
model = qwen2.5:7b
url = http://localhost:11434/api/chat

[laya]
model = multilingual
# laya only answers a sector if it is at least this sure (0-1)
threshold = 0.8

# API keys: leave empty to use the environment variables ANTHROPIC_API_KEY / OPENAI_API_KEY instead.
[claude]
model = claude-opus-5-5
# put your Claude API key here, NEVER SHARE IT 
api_key = 

[chatgpt]
model = gpt-5-mini
# put your ChatGPT API key here, NEVER SHARE IT
api_key = 
